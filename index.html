<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#fff6f1" />
  <title>A Little Note for Today ✿</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #594653;
      --muted: #9c8291;
      --pink: #f28eaa;
      --pink-dark: #df718f;
      --cream: #fffaf5;
      --lavender: #eee8ff;
      --shadow: 0 24px 70px rgba(145, 105, 133, .15);
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 28px 18px;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 12% 18%, #ffe1e8 0, transparent 34%),
        radial-gradient(ellipse at 88% 82%, #e8e4ff 0, transparent 36%),
        #fff8f4;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }
    .sparkle { position: fixed; pointer-events: none; color: #e9b3c5; animation: float 5s ease-in-out infinite; }
    .sparkle.one { top: 12%; left: 12%; font-size: 28px; }
    .sparkle.two { top: 22%; right: 13%; font-size: 19px; animation-delay: -2s; }
    .sparkle.three { bottom: 13%; left: 18%; font-size: 21px; animation-delay: -1s; }
    .sparkle.four { bottom: 19%; right: 17%; font-size: 29px; animation-delay: -3s; }
    @keyframes float { 50% { transform: translateY(-12px) rotate(12deg); } }
    .card {
      width: min(100%, 510px);
      padding: 42px clamp(23px, 7vw, 52px) 36px;
      position: relative;
      text-align: center;
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 30px;
      background: rgba(255, 253, 250, .88);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }
    .flower { font-size: 42px; line-height: 1; animation: bob 3s ease-in-out infinite; }
    @keyframes bob { 50% { transform: translateY(-5px) rotate(-5deg); } }
    .eyebrow { margin: 17px 0 9px; color: var(--pink-dark); font-size: 11px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; }
    h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(32px, 8vw, 43px); font-weight: 500; letter-spacing: -.04em; }
    .intro { margin: 13px auto 25px; max-width: 330px; color: var(--muted); font-size: 15px; line-height: 1.65; }
    button { font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .primary {
      min-height: 49px; padding: 0 23px; border: 0; border-radius: 999px;
      color: white; background: var(--pink); font-weight: 700;
      box-shadow: 0 8px 18px rgba(242, 142, 170, .27); transition: transform .2s, background .2s;
    }
    .primary:hover { transform: translateY(-2px); background: var(--pink-dark); }
    .primary:focus-visible, .choice:focus-visible { outline: 3px solid #b69be9; outline-offset: 4px; }
    .prediction {
      margin: 24px 0 0; padding: 20px 19px; border-radius: 20px;
      background: linear-gradient(135deg, #fff0f3, #f3efff); animation: appear .45s ease both;
    }
    @keyframes appear { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: translateY(0); } }
    .prediction-label { margin: 0 0 8px; color: var(--pink-dark); font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    .prediction-text { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: 19px; line-height: 1.5; }
    .question { margin: 25px 0 4px; font-size: 16px; font-weight: 700; }
    .choices { position: relative; height: 72px; margin-top: 12px; }
    .choice { position: absolute; top: 11px; min-height: 43px; padding: 0 17px; border: 1px solid #f3dbe3; border-radius: 999px; background: #fff; color: var(--ink); font-size: 13px; font-weight: 700; transition: left .22s ease, top .22s ease, transform .2s; }
    .choice.yes { left: 9%; color: #fff; border-color: var(--pink); background: var(--pink); }
    .choice.yes:hover { transform: translateY(-2px); }
    .choice.no { right: 7%; }
    .hidden { display: none !important; }
    .response { min-height: 25px; margin: 9px 0 0; color: var(--pink-dark); font-family: Georgia, "Times New Roman", serif; font-size: 17px; }
    .tiny { margin: 22px 0 0; color: #b49eaa; font-size: 11px; }
    @media (max-width: 390px) { .card { padding-top: 34px; } .choice { padding: 0 13px; font-size: 12px; } .choice.yes { left: 2%; } .choice.no { right: 2%; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <span class="sparkle one" aria-hidden="true">✦</span>
  <span class="sparkle two" aria-hidden="true">♡</span>
  <span class="sparkle three" aria-hidden="true">✧</span>
  <span class="sparkle four" aria-hidden="true">♡</span>

  <main class="card">
    <div class="flower" aria-hidden="true">🌷</div>
    <p class="eyebrow">a little moment just for you</p>
    <h1>Today is yours</h1>
    <p class="intro">Take a tiny breath, make a little wish, and let’s see what lovely thing today might have in store. ✨</p>

    <button class="primary" id="predictButton" type="button">✨ &nbsp; What’s my little prediction?</button>
    <section class="prediction hidden" id="prediction" aria-live="polite" aria-atomic="true">
      <p class="prediction-label">your little prediction</p>
      <p class="prediction-text" id="predictionText"></p>
    </section>

    <section class="check-in hidden" id="checkIn">
      <p class="question">So… is it a good day?</p>
      <div class="choices" id="choices">
        <button class="choice yes" id="yesButton" type="button">It’s a lovely day ♡</button>
        <button class="choice no" id="noButton" type="button">Not really…</button>
      </div>
      <p class="response" id="response" aria-live="polite"></p>
    </section>
    <p class="tiny">a little reminder: you deserve good things 🌸</p>
  </main>

  <script>
    const predictions = [
      "A little unexpected moment will make you smile today. Keep your heart open. 💌",
      "You’ll find a reason to feel proud of yourself—don’t forget to celebrate it. 🌷",
      "Something cozy, sweet, and just what you need is on its way. ☕",
      "A lovely person may brighten your day… and you might brighten theirs, too. 💕",
      "Today is perfect for a tiny adventure or doing something just for you. ✨",
      "A small win is waiting around the corner. You’ve got this, lovely. 🍓",
      "You’ll notice something beautiful today that you might usually rush past. 🌼",
      "Your future self says thank you for taking things one gentle step at a time. 🦋"
    ];
    const predictButton = document.getElementById('predictButton');
    const prediction = document.getElementById('prediction');
    const predictionText = document.getElementById('predictionText');
    const checkIn = document.getElementById('checkIn');
    const choices = document.getElementById('choices');
    const noButton = document.getElementById('noButton');
    const yesButton = document.getElementById('yesButton');
    const response = document.getElementById('response');
    let lastPrediction = -1;

    predictButton.addEventListener('click', () => {
      let next;
      do { next = Math.floor(Math.random() * predictions.length); } while (next === lastPrediction);
      lastPrediction = next;
      predictionText.textContent = predictions[next];
      prediction.classList.remove('hidden');
      checkIn.classList.remove('hidden');
      response.textContent = '';
      noButton.style.left = '';
      noButton.style.top = '';
      noButton.style.right = '7%';
      noButton.style.position = 'absolute';
      predictButton.textContent = '✨  Get another little prediction';
    });

    function letItRunAway() {
      const area = choices.getBoundingClientRect();
      const button = noButton.getBoundingClientRect();
      const maxX = Math.max(0, area.width - button.width);
      const maxY = Math.max(0, area.height - button.height);
      noButton.style.right = 'auto';
      noButton.style.left = `${Math.random() * maxX}px`;
      noButton.style.top = `${Math.random() * maxY}px`;
    }
    noButton.addEventListener('pointerenter', letItRunAway);
    noButton.addEventListener('pointerdown', (event) => { event.preventDefault(); letItRunAway(); });
    noButton.addEventListener('click', (event) => { event.preventDefault(); letItRunAway(); });
    noButton.addEventListener('focus', letItRunAway);
    yesButton.addEventListener('click', () => {
      response.textContent = 'I knew it! You make the day a little brighter just by being you. ♡';
      yesButton.textContent = 'Yes, it really is ♡';
    });
  </script>
</body>
</html>
